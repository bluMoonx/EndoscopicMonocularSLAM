%YAML:1.0

#--------------------------------------------------------------------------------------------
# Argus - Hamlyn rectified01, LEFT camera, MONOCULAR.
# Intrinsics verbatim from vslamlab intrinsics_rectified01.txt. 640x480, rectified (no distortion).
# Same tuned ORB settings as rectified05 so the two sequences are comparable.
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 383.1901395
Camera1.fy: 383.1901395
Camera1.cx: 155.9659519195557
Camera1.cy: 124.3335933685303

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0
Camera1.k3: 0.0

Camera.fps: 30
Camera.RGB: 1

Camera.width: 640
Camera.height: 480

ORBextractor.nFeatures: 4000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 10
ORBextractor.iniThFAST: 5
ORBextractor.minThFAST: 2

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
